# Technical Analysis Parameters - Optimized via Grid Search for SRTRANSFIN

# MACD Parameters
macd:
  fast_period: 12
  slow_period: 26
  signal_period: 9

# Support and Resistance Parameters
support_resistance:
  support_period: 14
  resistance_period: 14

# ATR Parameters
atr:
  window: 14

# EMA Parameters
ema:
  period: 20

# Bollinger Bands Parameters
bollinger_bands:
  length: 20
  std: 2.0

# RSI Parameters
rsi:
  length: 14
  oversold: 30
  overbought: 70

# Risk Management Parameters
risk_management:
  stop_loss_atr_multiplier: 2.0
  take_profit_atr_multiplier: 3.0

# Default column names
columns:
  open: 'open'
  high: 'high'
  low: 'low'
  close: 'close'
  volume: 'volume'
  timestamp: 'timestamp'
